# Ambiente local OPCIONAL do ChamaLÁ. O banco padrão é o Supabase (chamala-backend/.env).
# Use isto só para trabalhar offline ou testar migrações num banco descartável:
#   docker compose up -d --build   → banco (PostGIS) + API em http://localhost:8085
#   docker compose up -d db        → só o banco; rode a API sem DB_URL no .env
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: chamala
      POSTGRES_USER: chamala
      POSTGRES_PASSWORD: chamala
    ports:
      - "5432:5432"
    volumes:
      - chamala-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamala -d chamala"]
      interval: 5s
      retries: 10

  api:
    build: ./chamala-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/chamala
      DB_USER: chamala
      DB_PASSWORD: chamala
      PORT: 8085
      # Banco local começa vazio: o Flyway cria as tabelas.
      FLYWAY_ENABLED: "true"
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy

volumes:
  chamala-db:
