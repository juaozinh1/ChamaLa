spring:
  application:
    name: chamala-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chamala}
    username: ${DB_USER:chamala}
    password: ${DB_PASSWORD:chamala}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
