server:
  port: ${PORT:8085}

spring:
  # Lê chamala-backend/.env (fora do git) quando a API roda a partir dessa pasta.
  # Variáveis de ambiente do sistema têm prioridade sobre o arquivo.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Sem DB_URL, usa o PostGIS local do docker-compose.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chamala}
    username: ${DB_USER:chamala}
    password: ${DB_PASSWORD:chamala}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

logging:
  level:
    org.springframework.web: DEBUG
