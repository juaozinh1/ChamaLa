name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @redocly/cli lint chamala-backend/api/openapi.yaml --config chamala-backend/api/redocly.yaml

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chamala-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chamala-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chamala-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Os testes usam Testcontainers (PostGIS em Docker), já disponível no runner.
      - run: mvn -B verify
